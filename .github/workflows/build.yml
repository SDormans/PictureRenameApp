name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build PictureRenameApp.sln -c Release
      - name: Test
        run: dotnet test PictureRenameApp.Tests/PictureRenameApp.Tests.csproj -c Release
